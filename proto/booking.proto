syntax = 'proto3';

package booking;

service BookingService {
   // Admin Endpoints
   rpc CreateEvent (CreateEventRequest) returns (CreateEventResponse);
   rpc DeleteEvent (DeleteEventRequest) returns (DeleteEventResponse);
   rpc UpdateEvent (UpdateEventRequest) returns (UpdateEventResponse);

   // Public Endpoints
   rpc GetEvents (Empty) returns (GetEventsResponse);
   rpc GetEventDetails (GetEventDetailsRequest) returns (GetEventDetailsResponse);

   // Transactional Endpoints
   rpc ReserveSeat (ReserveSeatRequest) returns (ReserveSeatResponse);
   rpc ConfirmBooking (ConfirmBookingRequest) returns (ConfirmBookingResponse);
}

// ----- Generic -----
message Empty {}

// ----- Admin: Create Event -----
message CreateEventRequest {
   string name = 1;
   string date = 2; // ISO 8601 string
   int32 totalCapacity = 3;
   double basePrice = 4;
   string artist = 5;
   string description = 6;
   string venue = 7;
   string image = 8;
}

message CreateEventResponse {
   string eventId = 1;
   string message = 2;
}

message DeleteEventRequest {
   string eventId = 1;
}

message DeleteEventResponse {
   bool success = 1;
   string message = 2;
}

message UpdateEventRequest {
   string eventId = 1;
   string name = 2;
   string artist = 3;
   string description = 4;
   string venue = 5;
   string image = 6;
   string date = 7;
}

message UpdateEventResponse {
   bool success = 1;
   string message = 2;
}

// ----- Public: Fetch Events -----
message EventSummary {
   string id = 1;
   string name = 2;
   string date = 3;
   int32 availableTickets = 4;
   string artist = 5;
   string venue = 6;
   string image = 7;
   int32 totalCapacity = 8;
}

message GetEventsResponse {
   repeated EventSummary events = 1;
}

// ----- Public: Event Details & Seats -----
message SeatDTO {
   string id = 1;
   string seatNumber = 2;
   string status = 3; // AVAILABLE, RESERVED, SOLD
   double price = 4;
}

message GetEventDetailsRequest {
   string eventId = 1;
}

message GetEventDetailsResponse {
   string id = 1;
   string name = 2;
   string date = 3;
   repeated SeatDTO seats = 4;
   string artist = 5;
   string description = 6;
   string venue = 7;
   string image = 8;
}

// ----- Transactions: Reservations & Booking -----
message ReserveSeatRequest {
   string eventId = 1;
   string ticketId = 2; // Changed from seat_id to align with DB schema
   string userId = 3;
}

message ReserveSeatResponse {
   bool success = 1;
   string reservationId = 2;
   string expiresAt = 3;
   string message = 4;
}

message ConfirmBookingRequest {
   string reservationId = 1;
   string paymentId = 2;
   string userId = 3;
}

message ConfirmBookingResponse {
   bool success = 1;
   string orderId = 2;
   string status = 3;
   string message = 4;
}
